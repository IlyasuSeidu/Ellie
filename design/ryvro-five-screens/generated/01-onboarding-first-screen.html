<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ryvro Onboarding First Screen</title>
    <style>
      :root {
        --bg: #030609;
        --panel: rgba(10, 22, 30, 0.72);
        --panel-strong: rgba(13, 34, 48, 0.9);
        --cyan: #21f4dc;
        --teal: #1bbab4;
        --blue: #1279ff;
        --silver: #c8d8e5;
        --gold: #f4b83f;
        --text: #f5fbff;
        --muted: #aab8c3;
        --line: rgba(182, 225, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .screen {
        position: relative;
        width: 1290px;
        height: 2796px;
        overflow: hidden;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 4%, rgba(33, 244, 220, 0.22), transparent 22%),
          radial-gradient(circle at 86% 12%, rgba(18, 121, 255, 0.2), transparent 26%),
          linear-gradient(180deg, #051018 0%, #030609 54%, #020405 100%);
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(180deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 74px 74px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 54%);
      }

      .content {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 162px 96px 112px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .brand-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .mark {
        width: 116px;
        height: 116px;
        border-radius: 32px;
        display: grid;
        place-items: center;
        background:
          linear-gradient(145deg, rgba(190, 223, 242, 0.3), transparent 42%),
          linear-gradient(145deg, rgba(33, 244, 220, 0.18), rgba(18, 121, 255, 0.22)),
          rgba(2, 6, 9, 0.92);
        border: 2px solid rgba(211, 236, 249, 0.34);
        box-shadow:
          0 0 0 2px rgba(33, 244, 220, 0.08),
          0 28px 70px rgba(18, 121, 255, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.42);
      }

      .mark-symbol {
        position: relative;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 12px solid rgba(33, 244, 220, 0.86);
        border-right-color: var(--blue);
        border-top-color: rgba(200, 216, 229, 0.8);
        transform: rotate(-32deg);
      }

      .mark-symbol::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        top: -14px;
        left: 1px;
        border-radius: 6px;
        background: linear-gradient(145deg, #ffd46e, var(--gold));
        box-shadow: 0 0 20px rgba(244, 184, 63, 0.45);
      }

      .mark-symbol::after {
        content: "";
        position: absolute;
        width: 28px;
        height: 16px;
        left: 18px;
        top: 25px;
        border-left: 8px solid var(--cyan);
        border-bottom: 8px solid var(--cyan);
        transform: rotate(-12deg);
      }

      .brand-name {
        font-size: 42px;
        font-weight: 760;
        letter-spacing: 0;
        color: var(--silver);
      }

      .hero {
        width: 100%;
        margin-top: 316px;
      }

      h1 {
        max-width: 980px;
        margin: 0;
        font-size: 112px;
        line-height: 1.03;
        letter-spacing: 0;
        font-weight: 820;
        color: var(--text);
      }

      .support {
        max-width: 900px;
        margin: 42px 0 0;
        font-size: 42px;
        line-height: 1.32;
        color: var(--muted);
        letter-spacing: 0;
      }

      .demo-card {
        width: 100%;
        margin-top: 154px;
        padding: 44px;
        border: 2px solid var(--line);
        border-radius: 46px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025)),
          var(--panel);
        box-shadow:
          0 36px 100px rgba(0, 0, 0, 0.42),
          0 0 96px rgba(33, 244, 220, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(24px);
      }

      .question-row {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .mic {
        flex: 0 0 auto;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, rgba(33, 244, 220, 0.25), rgba(18, 121, 255, 0.18));
        border: 2px solid rgba(33, 244, 220, 0.34);
        box-shadow: 0 0 44px rgba(33, 244, 220, 0.2);
      }

      .mic-shape {
        width: 30px;
        height: 48px;
        border: 7px solid var(--cyan);
        border-radius: 18px;
        position: relative;
      }

      .mic-shape::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -28px;
        width: 46px;
        height: 24px;
        border-bottom: 7px solid var(--cyan);
        border-left: 7px solid var(--cyan);
        border-right: 7px solid var(--cyan);
        border-radius: 0 0 22px 22px;
        transform: translateX(-50%);
      }

      .question {
        font-size: 40px;
        line-height: 1.2;
        color: var(--text);
        font-weight: 680;
      }

      .answer {
        margin-top: 42px;
        padding: 36px 38px;
        border-radius: 34px;
        background:
          linear-gradient(135deg, rgba(33, 244, 220, 0.18), rgba(18, 121, 255, 0.19)),
          var(--panel-strong);
        border: 2px solid rgba(33, 244, 220, 0.2);
      }

      .answer-label {
        font-size: 28px;
        color: var(--gold);
        font-weight: 760;
        margin-bottom: 10px;
      }

      .answer-text {
        font-size: 48px;
        color: var(--text);
        font-weight: 800;
      }

      .spacer {
        flex: 1;
      }

      .primary {
        width: 100%;
        height: 142px;
        border: 0;
        border-radius: 38px;
        color: #021014;
        font-size: 44px;
        font-weight: 840;
        letter-spacing: 0;
        background: linear-gradient(135deg, var(--cyan), #67d9ff 44%, var(--blue));
        box-shadow:
          0 26px 70px rgba(18, 121, 255, 0.34),
          0 0 60px rgba(33, 244, 220, 0.18),
          inset 0 2px 0 rgba(255, 255, 255, 0.52);
      }

      .secondary {
        margin-top: 36px;
        color: var(--silver);
        font-size: 34px;
        font-weight: 680;
      }
    </style>
  </head>
  <body>
    <main class="screen" role="img" aria-label="Ryvro onboarding first screen">
      <section class="content">
        <div class="brand-row">
          <div class="mark" aria-hidden="true">
            <div class="mark-symbol"></div>
          </div>
          <div class="brand-name">Ryvro</div>
        </div>

        <div class="hero">
          <h1>Ask Ryvro what shift you have.</h1>
          <p class="support">Set your shift pattern once. Then ask by voice anytime.</p>

          <div class="demo-card">
            <div class="question-row">
              <div class="mic" aria-hidden="true">
                <div class="mic-shape"></div>
              </div>
              <div class="question">What shift am I on Friday?</div>
            </div>
            <div class="answer">
              <div class="answer-label">Ryvro answers</div>
              <div class="answer-text">Friday: Night shift</div>
            </div>
          </div>
        </div>

        <div class="spacer"></div>
        <button class="primary">Set up my shifts</button>
        <div class="secondary">I already set it up</div>
      </section>
    </main>
  </body>
</html>
